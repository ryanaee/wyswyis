<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Two stylised eyes representing "what you see / what I see" -->
  <!-- Left eye -->
  <ellipse cx="168" cy="256" rx="72" ry="48" fill="none" stroke="#f5f0e8" stroke-width="20"/>
  <circle cx="168" cy="256" r="22" fill="#d42b2b"/>
  <circle cx="168" cy="256" r="10" fill="#0a0a0a"/>
  <!-- Right eye -->
  <ellipse cx="344" cy="256" rx="72" ry="48" fill="none" stroke="#f5f0e8" stroke-width="20"/>
  <circle cx="344" cy="256" r="22" fill="#1a3a6b"/>
  <circle cx="344" cy="256" r="10" fill="#0a0a0a"/>
  <!-- Wordmark -->
  <text
    x="256" y="430"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="6"
    text-anchor="middle"
    fill="#f5c518"
  >WYSWYIS</text>
</svg>
